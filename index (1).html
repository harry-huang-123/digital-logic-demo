<!doctype html>
<html lang="zh-Hant">
<head>
<meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>數位邏輯互動實驗室</title>
<style>
*{box-sizing:border-box}body{margin:0;font-family:system-ui,'Noto Sans TC',sans-serif;background:#0b1223;color:#eef4ff}.wrap{max-width:1100px;margin:auto;padding:32px 22px}h1{font-size:clamp(26px,4vw,42px);margin:0 0 8px}.sub{color:#9aacca;margin-bottom:28px}.grid{display:grid;grid-template-columns:1.5fr 1fr;gap:20px}.panel{background:#15213a;border:1px solid #2b3e61;border-radius:20px;padding:24px}.label{color:#aabbd6;font-size:14px}.switches{display:flex;gap:12px;flex-wrap:wrap;margin:20px 0}button{border:1px solid #4b6795;background:#263d63;color:white;border-radius:12px;padding:13px 20px;font-size:17px;cursor:pointer;min-width:110px}button:focus-visible{outline:3px solid #fff}button.on{background:#087f72;border-color:#36e5c6}.diagram{width:100%;height:auto;display:block;margin:20px auto}.wire{stroke:#667b9b;stroke-width:6;stroke-linecap:round;transition:stroke .25s}.wire.active{stroke:#40e6b3;filter:drop-shadow(0 0 5px #40e6b3)}.gate{fill:#243b60;stroke:#a9c3f1;stroke-width:4}.signal{font-size:24px;font-weight:700;fill:#fff}.lamp{width:20px;height:20px;display:inline-block;border-radius:50%;background:#4b5b73;vertical-align:middle;margin-right:8px}.lamp.on{background:#40e6b3;box-shadow:0 0 20px #40e6b3}.result{font-size:30px;font-weight:700;margin:18px 0}table{border-collapse:collapse;width:100%;margin-top:16px}th,td{padding:12px;text-align:center;border-bottom:1px solid #304363}tr.current{background:#27506b}code{color:#79e5ca;font-size:18px}.hint{line-height:1.7;color:#b8c9e4}@media(max-width:720px){.grid{grid-template-columns:1fr}.wrap{padding:20px 14px}.panel{padding:18px}}
</style>
</head>
<body><main class="wrap"><h1>⚡ 數位邏輯互動實驗室</h1><p class="sub">AND 邏輯閘 · 點擊輸入開關，觀察電路與真值表即時變化</p><div class="grid"><section class="panel"><div class="label">互動電路</div><div class="switches"><button id="a" type="button" aria-pressed="false">輸入 A：0</button><button id="b" type="button" aria-pressed="false">輸入 B：0</button><button id="reset" type="button">重設</button></div><svg class="diagram" viewBox="0 0 600 270" role="img" aria-label="兩個輸入接入 AND 邏輯閘，右側為輸出"><path id="wa" class="wire" d="M45 80 H250"/><path id="wb" class="wire" d="M45 190 H250"/><path class="gate" d="M250 45 H330 A90 90 0 0 1 330 225 H250 Z"/><path id="wy" class="wire" d="M420 135 H535"/><text id="ta" class="signal" x="55" y="67">A=0</text><text id="tb" class="signal" x="55" y="179">B=0</text><text class="signal" x="277" y="144">AND</text><text id="ty" class="signal" x="485" y="118">Y=0</text><circle id="led" cx="550" cy="135" r="17" fill="#4b5b73"/></svg><div class="result"><span id="lamp" class="lamp"></span>輸出 Y = <span id="out">0</span></div><p>布林代數：<code>Y = A · B</code></p><p class="hint" id="explain" aria-live="polite">AND 閘只有在 A、B 都是 1 時，輸出才是 1。</p></section><section class="panel"><div class="label">AND 真值表</div><table><thead><tr><th>A</th><th>B</th><th>Y</th></tr></thead><tbody><tr id="r00"><td>0</td><td>0</td><td>0</td></tr><tr id="r01"><td>0</td><td>1</td><td>0</td></tr><tr id="r10"><td>1</td><td>0</td><td>0</td></tr><tr id="r11"><td>1</td><td>1</td><td>1</td></tr></tbody></table><p class="hint">目前輸入組合會在真值表中反白。亮綠色導線代表邏輯 1。</p></section></div></main><script>
(()=>{let a=0,b=0;const $=id=>document.getElementById(id);function render(){const y=a&b;for(const [id,v] of [['a',a],['b',b]]){$(id).textContent=`輸入 ${id.toUpperCase()}：${v}`;$(id).classList.toggle('on',!!v);$(id).setAttribute('aria-pressed',String(!!v))}for(const [id,v] of [['wa',a],['wb',b],['wy',y],['lamp',y]])$(id).classList.toggle('on',!!v),$(id).classList.toggle('active',!!v);$('ta').textContent='A='+a;$('tb').textContent='B='+b;$('ty').textContent='Y='+y;$('out').textContent=y;$('led').setAttribute('fill',y?'#40e6b3':'#4b5b73');$('led').style.filter=y?'drop-shadow(0 0 12px #40e6b3)':'';for(const row of document.querySelectorAll('tbody tr'))row.classList.toggle('current',row.id===`r${a}${b}`);$('explain').textContent=y?'A 與 B 都是 1，因此 AND 閘輸出 1，LED 亮起。':'至少有一個輸入是 0，因此 AND 閘輸出 0，LED 熄滅。'}$('a').addEventListener('click',()=>{a^=1;render()});$('b').addEventListener('click',()=>{b^=1;render()});$('reset').addEventListener('click',()=>{a=0;b=0;render()});render()})();
</script></body></html>
